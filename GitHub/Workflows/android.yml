name: Build APK
on:{workflow_dispatch: {}}
jobs:{build:{runs-on:ubuntu-latest,steps:[{uses:actions/checkout@v4},{uses:actions/setup-java@v4,with:{distribution:temurin,java-version:'17'}},{uses:gradle/actions/setup-gradle@v4,with:{gradle-version:'8.11.1'}},{name:Build,working-directory:android,run:gradle assembleDebug},{uses:actions/upload-artifact@v4,with:{name:learn-with-me-debug-apk,path:android/app/build/outputs/apk/debug/app-debug.apk}}]}}