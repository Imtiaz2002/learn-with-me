<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <meta name="description" content="Learn with Me - Your personal learning space">
  <title>Learn with Me</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app-shell">

  <section id="login" class="screen active">
    <div class="login-hero">
      <div class="logo">LM</div>
      <div class="eyebrow">LEARN WITH ME</div>
      <h1>Learn • Practice • Grow</h1>
      <p>Your personal learning space</p>
    </div>

    <div class="card auth-card">
      <div class="card-kicker">WELCOME BACK</div>
      <h2>Sign in to continue</h2>
      <p class="muted">Use your mobile number to access your courses.</p>

      <label for="phone">Mobile number</label>
      <input id="phone" type="tel" inputmode="tel" autocomplete="tel"
             placeholder="+91XXXXXXXXXX">

      <button id="sendOtp" class="primary">Send OTP <span>→</span></button>

      <div id="otpArea" class="hidden">
        <label for="otp">Verification code</label>
        <input id="otp" type="text" inputmode="numeric" autocomplete="one-time-code"
               maxlength="6" placeholder="6 digit OTP">
        <button id="verifyOtp" class="primary">Verify & Continue <span>→</span></button>
      </div>

      <div id="recaptcha-container"></div>
      <p id="authStatus" class="status" aria-live="polite"></p>
    </div>
  </section>

  <section id="home" class="screen">
    <header class="topbar">
      <div>
        <div class="eyebrow">LEARN WITH ME</div>
        <h2>My Courses</h2>
        <p class="top-subtitle">Choose a course and start learning.</p>
      </div>
      <button id="logout" class="logout">Logout</button>
    </header>

    <div class="welcome-strip">
      <div class="welcome-icon">✦</div>
      <div>
        <strong>Keep learning, one lesson at a time.</strong>
        <span>Explore your courses below.</span>
      </div>
    </div>

    <div id="courses" class="course-list"></div>
  </section>

  <section id="course" class="screen">
    <button id="backHome" class="back">← All Courses</button>
    <div id="courseHeader" class="course-hero card"></div>
    <div id="courseContent"></div>
  </section>

  <section id="lesson" class="screen">
    <button id="backCourse" class="back">← Back to Course</button>
    <div id="lessonContent"></div>
  </section>

</main>
<script type="module" src="app.js"></script>
</body>
</html>
